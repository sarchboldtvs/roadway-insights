name: Rules sync
on:
  workflow_dispatch:
    inputs:
      kit_version: { description: "Kit tag, e.g. v0.1.1", required: true }
jobs:
  sync:
    uses: sarchboldtvs/snowflake-aidlc-scaffoled-kit/.github/workflows/rules-sync.yml@v0.1.0
    with: { kit_version: "${{ inputs.kit_version }}" }
    secrets: { KIT_TOKEN: "${{ secrets.KIT_TOKEN }}" }
