name: Terraform plan
on:
  pull_request:
    paths: ["terraform/**"]
  workflow_dispatch:
    inputs:
      generate_config: { description: "Generate HCL for import blocks", type: boolean, default: false }
jobs:
  plan:
    uses: sarchboldtvs/snowflake-aidlc-scaffoled-kit/.github/workflows/tf-plan.yml@v0.1.0
    with: { generate_config: "${{ inputs.generate_config || false }}" }
    secrets: inherit
