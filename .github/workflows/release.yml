name: Release
# PROD, in order. Each job runs in the prod environment (required reviewers).
on:
  workflow_dispatch:
    inputs:
      issue: { description: "Parent issue number", required: true }
jobs:
  terraform:
    uses: sarchboldtvs/snowflake-aidlc-scaffoled-kit/.github/workflows/tf-apply.yml@v0.1.0
    with: { environment: prod, ref: main }
    secrets: inherit
  dcm:
    needs: terraform
    uses: sarchboldtvs/snowflake-aidlc-scaffoled-kit/.github/workflows/dcm.yml@v0.1.0
    with: { action: deploy, target: PROD, environment: prod }
    secrets: inherit
  powerbi:
    needs: dcm
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - run: |
          echo "Power BI promotion is manual in kit v0.1: follow docs/releases for issue #${{ inputs.issue }}."
